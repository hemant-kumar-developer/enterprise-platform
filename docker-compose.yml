version: '3.9'
services:
  api-gateway:
    build:
      context: ./apps/services/api-gateway
    ports:
      - '8080:8080'
    environment:
      PORT: 8080

  shell:
    build:
      context: ./apps/frontend/shell
    ports:
      - '3000:3000'
    environment:
      VITE_PORT: 3000

  product-mfe:
    build:
      context: ./apps/frontend/product-mfe
    ports:
      - '3001:3001'
    environment:
      VITE_PORT: 3001

  cart-mfe:
    build:
      context: ./apps/frontend/cart-mfe
    ports:
      - '3002:3002'
    environment:
      VITE_PORT: 3002
